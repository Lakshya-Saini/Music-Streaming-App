services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/music-streaming
      CLIENT_ORIGIN: http://localhost:5173
      AWS_REQUIRE_EXPLICIT_CREDENTIALS: "true"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:

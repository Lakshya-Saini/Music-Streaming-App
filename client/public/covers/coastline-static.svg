<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="36"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081712"/>
      <stop offset="1" stop-color="#060e0d"/>
    </linearGradient>
    <linearGradient id="band" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0f3a30"/>
      <stop offset="1" stop-color="#081f1a"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.28" cy="0.72" r="0.58">
      <stop offset="0" stop-color="#7de3ae"/>
      <stop offset=".55" stop-color="#34c759"/>
      <stop offset="1" stop-color="#146b34"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.35" cy="0.68" r="0.95">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>

    <path d="M64 150h300" stroke="#ffffff" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 176h180" stroke="#ffffff" stroke-opacity=".14" stroke-width="6" stroke-linecap="round"/>
    <rect width="512" height="512" fill="url(#vignette)"/>

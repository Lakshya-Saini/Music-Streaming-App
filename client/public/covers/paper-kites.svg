  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <path d="M0 512V300c110-40 200 8 268 84 58 66 132 92 244 60v68z" fill="url(#band)"/>
    <circle cx="356" cy="146" r="132" fill="url(#orb)"/>
    <circle cx="356" cy="146" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <path d="M60 210c40-56 92-56 132 0" stroke="#ffffff" stroke-opacity=".28" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect width="512" height="512" fill="url(#vignette)"/>
